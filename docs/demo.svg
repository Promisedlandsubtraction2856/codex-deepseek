<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Terminal demo: codex-deepseek --version, codex-deepseek debug models --bundled, and codex --version, showing the DeepSeek CLI and the untouched ChatGPT CLI side by side.">
  <title>codex-deepseek: the DeepSeek CLI and the untouched ChatGPT CLI</title>
  <style>
    .bg      { fill: #0c0c0c; }
    .chrome  { fill: #1a1a1a; }
    .title   { fill: #a0a0a0; font: 12px "Segoe UI", Arial, sans-serif; }
    .l       { font: 13px "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; dominant-baseline: middle; }
    .prompt  { fill: #4ec9b0; }
    .cmd     { fill: #f0f0f0; }
    .json    { fill: #9cdcfe; }
    .plain   { fill: #d4d4d4; }
    .comment { fill: #6a9955; }
    .line    { opacity: 1; animation: fade 0.01s linear both; }
    .cursor  { animation: blink 1.05s steps(1) infinite; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes blink { 0%, 49.9% { opacity: 1 } 50%, 100% { opacity: 0 } }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="330" rx="10"/>
  <rect class="chrome" x="0" y="0" width="760" height="34" rx="10"/>
  <rect class="chrome" x="0" y="24" width="760" height="10"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text class="title" x="380" y="21" text-anchor="middle">Windows Terminal &#8212; D:\code\codex-deepseek</text>

  <!-- 1. the DeepSeek CLI -->
  <g class="line" style="animation-delay:0.3s">
    <text class="l prompt" x="22" y="60">PS&gt;</text>
    <text class="l cmd" x="52" y="60">codex-deepseek --version</text>
  </g>
  <g class="line" style="animation-delay:0.9s">
    <text class="l plain" x="52" y="84">codex-cli 0.154.0</text>
    <text class="l comment" x="212" y="84"># the real binary, launched with CODEX_HOME=.codex-deepseek</text>
  </g>

  <!-- 2. the pinned model catalog -->
  <g class="line" style="animation-delay:1.5s">
    <text class="l prompt" x="22" y="132">PS&gt;</text>
    <text class="l cmd" x="52" y="132">codex-deepseek debug models --bundled</text>
  </g>
  <g class="line" style="animation-delay:2.1s">
    <text class="l json" x="52" y="156">{"models":[{"slug":"deepseek-flash","display_name":"DeepSeek Flash",</text>
  </g>
  <g class="line" style="animation-delay:2.4s">
    <text class="l json" x="52" y="180">  "default_reasoning_level":"high","supported_reasoning_levels":[...]},</text>
  </g>
  <g class="line" style="animation-delay:2.7s">
    <text class="l json" x="52" y="204">  {"slug":"deepseek-v4-pro","display_name":"DeepSeek V4 Pro", ...}]}</text>
  </g>

  <!-- 3. the untouched ChatGPT CLI -->
  <g class="line" style="animation-delay:3.3s">
    <text class="l prompt" x="22" y="252">PS&gt;</text>
    <text class="l cmd" x="52" y="252">codex --version</text>
    <text class="l comment" x="180" y="252"># ChatGPT login, untouched</text>
  </g>
  <g class="line" style="animation-delay:3.9s">
    <text class="l plain" x="52" y="276">codex-cli 0.154.0</text>
  </g>

  <g class="line" style="animation-delay:4.4s">
    <text class="l prompt" x="22" y="306">PS&gt;</text>
    <rect class="cursor" x="52" y="297" width="8" height="16" fill="#cccccc"/>
  </g>
</svg>
