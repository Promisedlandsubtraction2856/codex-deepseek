name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the launcher
        shell: pwsh
        run: ./build.ps1

      - name: Launcher tests
        shell: pwsh
        run: ./tests/windows-launcher-test.ps1

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-deepseek-windows-x64
          path: dist/codex-deepseek.exe

  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n src/codex-deepseek.sh
          bash -n install.sh
          bash -n tests/posix-launcher-test.sh
          bash -n tests/posix-install-test.sh

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: |
          shellcheck -S warning \
            src/codex-deepseek.sh \
            install.sh \
            tests/posix-launcher-test.sh \
            tests/posix-install-test.sh

      - name: Launcher tests
        run: bash tests/posix-launcher-test.sh

      - name: Installer tests
        run: bash tests/posix-install-test.sh
